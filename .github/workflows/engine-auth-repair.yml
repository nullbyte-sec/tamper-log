name: One-time engine authentication repair
on:
  push:
    branches: [fix/security-hardening]
    paths:
      - .github/workflows/engine-auth-repair.yml
      - scripts/repair-engine-auth.py
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'nullbyte-sec/tamper-log' && github.ref == 'refs/heads/fix/security-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact approved branch commit and apply guarded repair
        env:
          REPAIR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          cd work
          git init -q
          git remote add origin https://github.com/nullbyte-sec/tamper-log.git
          auth=$(printf 'x-access-token:%s' "$REPAIR_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          python3 scripts/repair-engine-auth.py
          git diff --check
          test "$(git diff --name-only)" = 'server/tamperEngine.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/tamperEngine.ts
          git commit -m 'fix: require valid remote credentials inside tamper engine'
          git push origin HEAD:refs/heads/fix/security-hardening
